name: Pulse health check

# Independent dead-man's-switch. Silent when Pulse is collecting normally; emails
# only when no sync has arrived for 36h. Runs at 06:17 UTC — deliberately BEFORE
# the daily report, and at an odd minute, so the two never contend and a congested
# top-of-hour slot cannot delay it.
#
# Requires repo secret HEALTH_CHECK_SECRET matching the Cloudflare Pages env var.

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health check
        env:
          SECRET: ${{ secrets.HEALTH_CHECK_SECRET }}
        run: |
          if [ -z "$SECRET" ]; then
            echo "::error::HEALTH_CHECK_SECRET is not set in repo secrets."
            exit 1
          fi
          code=$(curl -sS -o response.json -w '%{http_code}' \
            -X POST 'https://pulse.gershoncrm.com/api/health-check' \
            -H 'Content-Type: application/json' \
            --data "$(jq -nc --arg s "$SECRET" '{secret:$s}')")
          echo "HTTP $code"
          cat response.json | jq . || cat response.json
          if [ "$code" != "200" ]; then
            echo "::error::Health check failed with HTTP $code"
            exit 1
          fi
