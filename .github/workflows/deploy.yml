name: Deploy Pulse Dashboard to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /var/www/gershonpulse
            git pull origin main || (git init && git remote add origin https://github.com/${{ github.repository }}.git && git pull origin main)
            npm install --production
            mkdir -p data
            pm2 restart gershonpulse || pm2 start server.js --name gershonpulse
            pm2 save
            echo "Deploy complete"
