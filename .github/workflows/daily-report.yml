name: Pulse daily report

# Fires the morning digest at 11:07 UTC = 7:07am US Eastern in summer (EDT),
# 6:07am in winter (EST). GitHub's cron is fixed UTC and does not follow DST;
# :07 rather than :00 because top-of-hour is the most congested slot on the
# shared runners and jobs there are routinely delayed 10-30 minutes.
#
# Requires repo secret HEALTH_CHECK_SECRET (or DAILY_REPORT_SECRET) matching the
# value set in Cloudflare Pages → Settings → Variables and Secrets → Production.

# SCHEDULE DELIBERATELY OFF (2026-09-02). Olivier asked for a WEEKLY email; the
# digest now mails every CLIENT, so switching the daily cron on would put mail in
# client inboxes every morning without them asking for it. The code is deployed and
# fully working — enable it by uncommenting the two lines below when that is wanted.
on:
  # schedule:
  #   - cron: '7 11 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: 'Report on a specific day (YYYY-MM-DD, local time). Blank = yesterday.'
        required: false
      dry:
        description: 'Set to 1 to build the report without emailing it.'
        required: false

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger daily report
        env:
          SECRET: ${{ secrets.DAILY_REPORT_SECRET || secrets.HEALTH_CHECK_SECRET }}
          DATE: ${{ github.event.inputs.date }}
          DRY: ${{ github.event.inputs.dry }}
        run: |
          if [ -z "$SECRET" ]; then
            echo "::error::Neither DAILY_REPORT_SECRET nor HEALTH_CHECK_SECRET is set in repo secrets."
            exit 1
          fi
          payload=$(jq -nc --arg s "$SECRET" --arg d "$DATE" --arg dry "$DRY" \
            '{secret:$s} + (if $d == "" then {} else {date:$d} end) + (if $dry == "" then {} else {dry:$dry} end)')
          code=$(curl -sS -o response.json -w '%{http_code}' \
            -X POST 'https://pulse.gershoncrm.com/api/daily-report' \
            -H 'Content-Type: application/json' \
            --data "$payload")
          echo "HTTP $code"
          # Never echo the payload — it carries the secret. The response does not.
          cat response.json | jq . || cat response.json
          if [ "$code" != "200" ]; then
            echo "::error::Daily report failed with HTTP $code"
            exit 1
          fi
